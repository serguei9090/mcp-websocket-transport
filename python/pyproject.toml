[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-websocket"
version = "0.1.0"
description = "Full-duplex WebSocket Transport for the Model Context Protocol (MCP) in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Serguei Castillo" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
keywords = ["mcp", "model-context-protocol", "websocket", "json-rpc", "llm", "ai", "anyio"]
dependencies = [
    "anyio>=3.6.0",
    "pydantic>=1.10.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.90.0", "starlette>=0.20.0", "uvicorn>=0.17.0"]
websockets = ["websockets>=11.0.0"]
mcp = ["mcp[cli]>=1.2.0"]
all = [
    "fastapi>=0.90.0",
    "starlette>=0.20.0",
    "uvicorn>=0.17.0",
    "websockets>=11.0.0",
    "mcp[cli]>=1.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mcp[cli]>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/serguei9090/mcp-websocket"
Repository = "https://github.com/serguei9090/mcp-websocket"

[project.scripts]
mcp-ws-bridge = "mcp_websocket.bridge:main_cli"

[tool.ruff]
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

