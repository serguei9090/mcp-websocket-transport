version: '3.8'

services:
  python-mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: mcp-python-server
    ports:
      - "8767:8767"
    environment:
      - HOST=0.0.0.0
      - PORT=8767
    networks:
      - mcp-net

  typescript-mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.typescript
    container_name: mcp-ts-server
    ports:
      - "8765:8765"
    environment:
      - HOST=0.0.0.0
      - PORT=8765
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
